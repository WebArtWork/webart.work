<div class="workflow-shell">
	<nav class="workflow-nav" aria-label="Workflow">
		<ul>
			@for (link of links(); track link.path) {
				<li>
					<a
						class="workflow-link"
						routerLinkActive="workflow-link--active"
						ariaCurrentWhenActive="page"
						[routerLink]="link.path"
						[routerLinkActiveOptions]="{ exact: link.exact }"
					>
						<span class="material-symbols-outlined text-[20px]" aria-hidden="true">{{
							link.icon
						}}</span>
						{{ link.label }}
					</a>
				</li>
			}
		</ul>

		@if (authService.user(); as user) {
			<div class="workflow-user">
				<a
						class="workflow-user-email"
						routerLink="/workflow/profile"
						routerLinkActive="workflow-user-email--active"
						[title]="user.email ?? ''"
						>{{ user.email }}</a
					>
				<button type="button" class="workflow-link workflow-logout" (click)="logout()">
					<span class="material-symbols-outlined text-[20px]" aria-hidden="true">logout</span>
					Log out
				</button>
			</div>
		}
	</nav>

	<div class="workflow-main">
		<router-outlet />
	</div>
</div>
