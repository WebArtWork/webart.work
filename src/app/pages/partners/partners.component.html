<section class="catalog-page px-4 pb-20 pt-28 sm:px-6 lg:px-8">
	<div class="mx-auto max-w-6xl">
		<a
			class="catalog-link inline-flex items-center gap-2 rounded-full px-4 py-2 text-sm font-semibold"
			routerLink="/"
		>
			<span class="material-symbols-outlined text-[18px]" aria-hidden="true">arrow_back</span>
			{{ 'Back to home' | translate }}
		</a>

		<div class="mt-8 text-center">
			<div class="catalog-pill">{{ 'Trusted With' | translate }}</div>
			<h1 class="catalog-title mt-5 text-3xl font-black sm:text-4xl">
				{{ 'Our partners' | translate }}
			</h1>
		</div>

		<div class="mt-10 grid gap-4 sm:grid-cols-2 xl:grid-cols-4">
			@for (partner of partners; track partner.id) {
				<a
					class="catalog-card flex min-h-48 flex-col items-center justify-center rounded-[1.35rem] p-6 text-center hover:-translate-y-0.5"
					[routerLink]="['/partner', partner.id]"
				>
					<div
						class="flex h-28 w-28 items-center justify-center overflow-hidden rounded-[1rem] bg-white/6 p-2"
					>
						<img
							class="h-full w-full object-contain"
							[alt]="partner.name"
							[ngSrc]="partner.thumb"
							width="112"
							height="112"
						/>
					</div>
					<h2 class="catalog-title mt-5 text-base font-bold">{{ partner.name }}</h2>
				</a>
			}
		</div>
	</div>
</section>
