		<script>
			try {
				const storedMode = localStorage.getItem('app-mode');
				const preferredMode =
					storedMode === 'dark' || storedMode === 'light'
						? storedMode
						: window.matchMedia('(prefers-color-scheme: dark)').matches
							? 'dark'
							: 'light';
				document.documentElement.setAttribute('data-mode', preferredMode);
			} catch {}
		</script>

		<style>
			#app-preload {
				position: fixed;
				inset: 0;
				z-index: 9999;
				display: flex;
				align-items: center;
				justify-content: center;
				background: radial-gradient(
					circle at 50% 42%,
					#3c3c42 0%,
					#222226 65%,
					#1a1a1d 100%
				);
			}
			#app-preload__halo {
				position: relative;
				display: flex;
				width: 280px;
				height: 280px;
				align-items: center;
				justify-content: center;
			}
			#app-preload__halo::before {
				content: '';
				position: absolute;
				inset: 0;
				border-radius: 50%;
				border: 4px solid rgba(215, 215, 29, 0.16);
				border-top-color: #d7d71d;
				animation: app-preload-spin 1.1s linear infinite;
			}
			#app-preload__logo {
				width: 168px;
				height: auto;
				filter: drop-shadow(0 0 28px rgba(248, 236, 32, 0.45));
				animation: app-preload-pulse 1.8s ease-in-out infinite;
			}
			@keyframes app-preload-spin {
				to {
					transform: rotate(360deg);
				}
			}
			@keyframes app-preload-pulse {
				0%,
				100% {
					transform: scale(1);
					opacity: 0.92;
				}
				50% {
					transform: scale(1.05);
					opacity: 1;
				}
			}
		</style>
		<noscript>
			<style>
				#app-preload {
					display: none;
				}
			</style>
		</noscript>
	</head>
	<body>
		<app-root></app-root>
		<div id="app-preload" aria-hidden="true">
			<div id="app-preload__halo">
				<img id="app-preload__logo" src="landing/logo.svg" alt="" width="168" height="195" />
			</div>
		</div>
	</body>
